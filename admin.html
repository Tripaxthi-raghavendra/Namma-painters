<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namma Painters | Quote Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#172019;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:24px;font-weight:900}.logo b{color:#e86f3d}.refresh{padding:10px 15px;border:1px solid #ddd;border-radius:10px;background:white;font-weight:800}.layout{display:grid;grid-template-columns:350px 1fr;gap:18px}.panel,.detail{background:white;border:1px solid #e2e3df;border-radius:18px;padding:18px}.item{padding:15px;border:1px solid #e4e5e1;border-radius:13px;margin:10px 0;cursor:pointer}.item:hover{border-color:#e86f3d}.item strong{display:block}.meta{font-size:12px;color:#68726b;margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f6e8df;color:#a84920;font-size:11px;font-weight:900;margin-top:7px}.empty{color:#788078;text-align:center;padding:50px 15px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photos img{width:100%;height:180px;object-fit:cover;border-radius:12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.info div{background:#f7f7f4;padding:12px;border-radius:10px}.label{display:block;color:#777;font-size:11px;text-transform:uppercase;font-weight:800}.quote{border-top:1px solid #ddd;margin-top:20px;padding-top:20px}.quote input,.quote textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:6px 0 12px}.quote textarea{height:90px}.btn{background:#2e5d4b;color:white;border:0;padding:13px 18px;border-radius:10px;font-weight:900;cursor:pointer}.status{font-weight:900}.warn{font-size:12px;color:#9a4d24;margin-top:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.photos img{height:140px}.info{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="head"><div class="logo">Namma <b>Painters</b> — Quotes</div><button class="refresh" onclick="load()">↻ Refresh</button></div>
<div class="layout"><div class="panel"><h3>Incoming requests</h3><div id="list">Loading...</div></div><div class="detail" id="detail"><div class="empty">Select a customer request to review photos and prepare a quote.</div></div></div></div>
<script>
let current=null;
async function load(){const r=await fetch('/api/requests');const d=await r.json();const el=document.getElementById('list');el.innerHTML='';if(!d.length){el.innerHTML='<div class="empty">No requests yet.</div>';return}
d.forEach(x=>{const a=document.createElement('div');a.className='item';a.innerHTML='<strong>'+esc(x.name)+'</strong><div class="meta">'+esc(x.service)+' · '+esc(x.location)+'</div><span class="pill">'+esc(x.status)+'</span>';a.onclick=()=>show(x);el.appendChild(a)})}
async function show(x){current=x;const r=await fetch('/api/requests/'+x.id);const d=await r.json();current=d;document.getElementById('detail').innerHTML='<h2>'+esc(d.name)+' <small style="font-size:12px;color:#777">#'+esc(d.id)+'</small></h2>'+
'<div class="info"><div><span class="label">Phone</span>'+esc(d.phone)+'</div><div><span class="label">Location</span>'+esc(d.location)+'</div><div><span class="label">Service</span>'+esc(d.service)+'</div><div><span class="label">Area</span>'+esc(d.area||'Not provided')+'</div><div><span class="label">Rooms</span>'+esc(d.rooms||'Not provided')+'</div><div><span class="label">Property</span>'+esc(d.property||'Not provided')+'</div></div>'+
'<p><b>Customer details:</b><br>'+esc(d.details||'None')+'</p><h3>Uploaded photos ('+d.photos.length+')</h3><div class="photos">'+d.photos.map(p=>'<a target="_blank" href="'+p+'"><img src="'+p+'"></a>').join('')+'</div>'+
'<div class="quote"><h3>Prepare quotation</h3><label>Status</label><select id="status"><option>Under Review</option><option>Quoted</option><option>Need More Information</option><option>Site Visit Required</option><option>Completed</option></select><label>Quote amount (₹)</label><input id="amount" type="number" placeholder="e.g. 25000"><label>Message to customer</label><textarea id="message" placeholder="Your quotation and important terms..."></textarea><button class="btn" onclick="save()">Save Quote</button><div class="warn">This dashboard is for your business use. Add authentication before deploying it publicly.</div></div>';document.getElementById('status').value=d.status}
async function save(){const body={status:document.getElementById('status').value,amount:document.getElementById('amount').value,message:document.getElementById('message').value};const r=await fetch('/api/requests/'+current.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){alert('Quote saved.');load();show(await (await fetch('/api/requests/'+current.id)).json())}else alert('Could not save.')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
